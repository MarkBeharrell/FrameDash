name: framedash
services:
  framedash:
    image: node:24-alpine
    container_name: framedash
    working_dir: /app
    env_file:
      - .env
    volumes:
      - /mnt/crates/data/framedash:/app
    command: sh -c "npm install && npm run build && npm run serve:all"
    tty: true
    ports:
      - "10.0.0.1:3004:3000"
