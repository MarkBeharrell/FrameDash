name: framedash
services:
  framedash:
    image: node:24-alpine
    container_name: framedash
    working_dir: /app
    env_file:
      - .env
    volumes:
      - /mnt/crates/data/builder:/app
    command: sh -c "npm install && npm run build && npm run start"
    tty: true
    ports:
      - "3004:3000/tcp"
